name: Build and Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Install and Build
      run: |
        npm install
        npm run build

    - name: Deploy to S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read --follow-symlinks --delete
      env:
        AWS_S3_BUCKET: altus-power-lp
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-west-1'  # Or your AWS region
        SOURCE_DIR: 'dist'

    - name: Invalidate CloudFront Distribution
      uses: chetan/invalidate-cloudfront-action@v1.2
      env:
        DISTRIBUTION_ID: E1KZ0C36OTLSTR
        PATHS: '/*'
        AWS_REGION: 'us-east-1' # CloudFront invalidations require us-east-1 regardless of where your distribution is
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
